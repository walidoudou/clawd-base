name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date: run 'npm run build' and commit the result." >&2
            git diff --stat -- dist
            exit 1
          fi
